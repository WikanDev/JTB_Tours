# Docker Compose for Dokploy Production Deployment
# This assumes MySQL is provided externally by Dokploy

services:
  # PHP-FPM Application Only
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jtb-tours-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    ports:
      - "8000:9000"
    environment:
      # Database connection will be provided via Dokploy env vars
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-jtb_tours}
      - DB_USERNAME=${DB_USERNAME:-jtb_admin_db}
      - DB_PASSWORD=${DB_PASSWORD:-jtb_tours_db_2025}
